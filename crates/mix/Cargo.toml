[package]
name = "soundcraft-mix"
description = "SoundCraft mix engine: renders a session's tracks, plugins, sends, busses and automation to audio"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-time.workspace = true
craft-audio.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host = { workspace = true, optional = true }
soundcraft-vst3-host = { workspace = true, optional = true }
soundcraft-au-host = { workspace = true, optional = true }
soundcraft-model.workspace = true
log.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true

[features]
default = ["plugin-hosts"]
# The CLAP, VST3 and Audio Units hosts. Without it a `clap:`, `vst3:` or `au:` plug-in id is an
# unknown plug-in and the hosted plug-in lists are empty.
plugin-hosts = ["dep:soundcraft-clap-host", "dep:soundcraft-vst3-host", "dep:soundcraft-au-host"]

[lints]
workspace = true
