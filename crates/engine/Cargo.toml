[package]
name = "soundcraft-engine"
description = "SoundCraft command engine: commands, undo, editing operations, import/export, bounce, parity catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-interchange.workspace = true
craft-score.workspace = true
craft-xml.workspace = true
soundcraft-time.workspace = true
craft-audio.workspace = true
craft-scraft-format.workspace = true
soundcraft-midi.workspace = true
soundcraft-dsp.workspace = true
soundcraft-clap-host = { workspace = true, optional = true }
soundcraft-vst3-host = { workspace = true, optional = true }
soundcraft-au-host = { workspace = true, optional = true }
soundcraft-model.workspace = true
soundcraft-mix.workspace = true
soundcraft-video.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
craft-docpath.workspace = true

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", features = ["kernel"] }

[features]
default = ["plugin-hosts"]
# The CLAP, VST3 and Audio Units hosts. Without it a `clap:`, `vst3:` or `au:` plug-in id is an
# unknown plug-in and the hosted plug-in lists are empty.
plugin-hosts = ["dep:soundcraft-clap-host", "dep:soundcraft-vst3-host", "dep:soundcraft-au-host", "soundcraft-mix/plugin-hosts"]

[dev-dependencies]
cfb.workspace = true
craft-aaf.workspace = true
proptest.workspace = true
zip.workspace = true

[lints]
workspace = true
